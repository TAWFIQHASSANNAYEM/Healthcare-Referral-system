{% extends 'recommender/base.html' %}
{% block title %}Create Referral - {{ hospital.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-plus-circle"></i> Create Referral to {{ hospital.name }}</h4>
                    <small class="text-muted">{{ hospital.upazila }}, {{ hospital.district }}</small>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="patient_name" class="form-label">Patient Name *</label>
                                    <input type="text" class="form-control" id="patient_name" name="patient_name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="patient_age" class="form-label">Patient Age *</label>
                                    <input type="number" class="form-control" id="patient_age" name="patient_age" min="0" max="150" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="patient_problem" class="form-label">Patient Problem/Condition *</label>
                            <textarea class="form-control" id="patient_problem" name="patient_problem" rows="3" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="department" class="form-label">Department *</label>
                                    <select class="form-select" id="department" name="department" required>
                                        <option value="">Select Department</option>
                                        {% for dept_code, dept_name in departments %}
                                        <option value="{{ dept_code }}">{{ dept_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="emergency_level" class="form-label">Emergency Level</label>
                                    <select class="form-select" id="emergency_level" name="emergency_level">
                                        <option value="0">Non-emergency</option>
                                        <option value="1">Level 1 (Minor)</option>
                                        <option value="2">Level 2 (Moderate)</option>
                                        <option value="3">Level 3 (Critical)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="upazila" class="form-label">Patient Upazila *</label>
                                    <input type="text" class="form-control" id="upazila" name="upazila" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="district" class="form-label">Patient District *</label>
                                    <input type="text" class="form-control" id="district" name="district" required>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-paper-plane"></i> Create Referral
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
